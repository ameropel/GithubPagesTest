<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Crash Stability Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- GENERATED BY PYTHON -->
  <script src="dashboard_data.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      background: #111827;
      padding: 18px 24px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #1f2937;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .scorecards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .scorecard {
      background: #111827;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #334155;
    }

    .scorecard-title {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .scorecard-value {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .scorecard-stat {
      margin-top: 6px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .owner-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .owner-tabs button {
      background: #111827;
      border: 1px solid #374151;
      color: #cbd5e1;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .owner-tabs button.active {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th {
      text-align: left;
      background: #111827;
      padding: 12px;
      font-size: 13px;
      color: #94a3b8;
    }

    td {
      padding: 12px;
      border-top: 1px solid #334155;
      font-size: 14px;
    }

    .signature {
      font-family: monospace;
      font-size: 12px;
    }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
    }

    @media (max-width: 1000px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    canvas {
      max-height: 320px;
    }

  </style>
</head>

<body>

<header>
  Crash Stability Dashboard
</header>

<div class="container">

  <!-- OWNER SUMMARY -->
  <div class="card">

    <h2>Owner Summary</h2>

    <div class="scorecards" id="scorecards"></div>

  </div>

  <!-- OWNER TABS -->
  <div class="card">

    <div class="owner-tabs" id="ownerTabs"></div>

  </div>

  <!-- TABLE + CHART -->
  <div class="layout">

    <!-- TABLE -->
    <div class="card">

      <h2>Top Crashes</h2>

      <table>

        <thead>
          <tr>
            <th>Signature</th>
            <th>Crash Count</th>
            <th>Impact</th>
            <th>Versions</th>
          </tr>
        </thead>

        <tbody id="crashTable"></tbody>

      </table>

    </div>

    <!-- CHART -->
    <div class="card">

      <h2>Crash Trend</h2>

      <canvas id="trendChart"></canvas>

    </div>

  </div>

</div>

<script>

let selectedOwner = null;
let trendChart = null;

////////////////////////////////////////////////////////
// SCORECARDS
////////////////////////////////////////////////////////

function renderScorecards() {

  const container = document.getElementById("scorecards");

  container.innerHTML = "";

  Object.entries(DASHBOARD_DATA.owners).forEach(([owner, data]) => {

    container.innerHTML += `
      <div class="scorecard">

        <div class="scorecard-title">
          ${owner}
        </div>

        <div class="scorecard-value">
          ${data.total_crashes.toLocaleString()}
        </div>

        <div class="scorecard-stat">
          Unique Crashes: ${data.unique_crashes}
        </div>

        <div class="scorecard-stat">
          User Impact: ${data.impact}
        </div>

      </div>
    `;
  });
}

////////////////////////////////////////////////////////
// OWNER TABS
////////////////////////////////////////////////////////

function renderOwnerTabs() {

  const container = document.getElementById("ownerTabs");

  container.innerHTML = "";

  Object.keys(DASHBOARD_DATA.owners).forEach((owner, index) => {

    const button = document.createElement("button");

    button.innerText = owner;

    if (index === 0) {
      button.classList.add("active");
      selectedOwner = owner;
    }

    button.onclick = () => {

      selectedOwner = owner;

      document.querySelectorAll(".owner-tabs button")
        .forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");

      renderCrashTable();
      renderTrendChart();
    };

    container.appendChild(button);
  });
}

////////////////////////////////////////////////////////
// TABLE
////////////////////////////////////////////////////////

function renderCrashTable() {

  const tbody = document.getElementById("crashTable");

  tbody.innerHTML = "";

  const crashes = DASHBOARD_DATA.crashes[selectedOwner];

  crashes.forEach(crash => {

    tbody.innerHTML += `
      <tr>

        <td class="signature">
          ${crash.signature}
        </td>

        <td>
          ${crash.count}
        </td>

        <td>
          ${crash.impact}
        </td>

        <td>
          ${crash.affected_versions}
        </td>

      </tr>
    `;
  });
}

////////////////////////////////////////////////////////
// CHART
////////////////////////////////////////////////////////

function renderTrendChart() {

  const trend = DASHBOARD_DATA.trend[selectedOwner];

  const labels = Object.keys(trend);

  const values = Object.values(trend);

  if (trendChart) {
    trendChart.destroy();
  }

  trendChart = new Chart(
    document.getElementById("trendChart"),
    {
      type: "line",

      data: {
        labels: labels,

        datasets: [{
          label: selectedOwner,
          data: values,
          borderColor: "#38bdf8",
          backgroundColor: "rgba(56,189,248,0.2)",
          fill: true,
          tension: 0.3
        }]
      },

      options: {
        responsive: true,

        plugins: {
          legend: {
            labels: {
              color: "#e2e8f0"
            }
          }
        },

        scales: {

          x: {
            ticks: {
              color: "#cbd5e1"
            },

            grid: {
              color: "rgba(255,255,255,0.05)"
            }
          },

          y: {
            ticks: {
              color: "#cbd5e1"
            },

            grid: {
              color: "rgba(255,255,255,0.05)"
            }
          }
        }
      }
    }
  );
}

////////////////////////////////////////////////////////
// INIT
////////////////////////////////////////////////////////

renderScorecards();
renderOwnerTabs();
renderCrashTable();
renderTrendChart();

</script>

</body>
</html>
